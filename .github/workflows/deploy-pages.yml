name: Deploy Portal Siege website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check out private shared assets
        uses: actions/checkout@v4
        with:
          repository: pedro7161/Portal-Siege-Assets
          ref: main
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: .shared-assets
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            .gitattributes
            final/game

      - name: Restore shared asset LFS cache
        uses: actions/cache@v4
        with:
          path: .shared-assets/.git/lfs
          key: portal-siege-assets-lfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            portal-siege-assets-lfs-${{ runner.os }}-

      - name: Select and download gallery images
        shell: bash
        run: |
          set -euo pipefail

          ASSET_ROOT=.shared-assets/final/game/assets
          if [[ ! -d "$ASSET_ROOT" ]]; then
            echo 'Expected final/game/assets in Portal-Siege-Assets.' >&2
            exit 1
          fi

          # Curated showcase picks — one hero-tier sprite per playable Human class, plus one
          # flagship unit per implemented enemy race. Deliberately NOT "whatever sorts first
          # under units/" — that used to surface unused units/constructs/* prototype art
          # instead of the actual roster. Keep this list and the CAPTIONS map in the gallery
          # build step below in sync when adding/removing a race or class.
          cat > .curated-assets.txt <<'CURATED'
          units/humans/knight/tier4/sprite.png
          units/humans/archer/tier4/sprite.png
          units/humans/rogue/tier4/sprite.png
          units/humans/paladin/tier4/sprite.png
          units/humans/berserker/tier4/sprite.png
          units/humans/mage/tier4/sprite.png
          units/humans/cleric/tier4/sprite.png
          units/dwarf/golem/tier4/sprite.png
          units/elf/blademaster/tier4/sprite.png
          units/skeleton/bone-warrior/tier4/sprite.png
          units/orc/row-03/tier4/sprite.png
          units/merfolk/tide-guardian/tier4/sprite.png
          units/treants/row-05/tier4/sprite.png
          units/vampire/crowned-vampire-king/sprite.png
          units/goblin/crowned-warlord/sprite.png
          CURATED

          : > .selected-assets.txt
          missing=0
          while IFS= read -r rel; do
            [[ -z "$rel" ]] && continue
            full="$ASSET_ROOT/$rel"
            if [[ ! -f "$full" ]]; then
              echo "Missing curated showcase asset: $rel" >&2
              missing=1
              continue
            fi
            echo "$full" >> .selected-assets.txt
          done < .curated-assets.txt

          if [[ "$missing" -eq 1 ]]; then
            echo 'One or more curated showcase assets are missing from Portal-Siege-Assets — update the curated list in this workflow.' >&2
            exit 1
          fi

          git -C .shared-assets lfs install --local

          INCLUDE_PATHS=$(sed 's#^\.shared-assets/##' .selected-assets.txt | paste -sd, -)
          git -C .shared-assets lfs pull --include="$INCLUDE_PATHS" --exclude=''

          echo "Selected $(wc -l < .selected-assets.txt) curated images for the website gallery."

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets/game

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.shared-assets/' \
            --exclude '.selected-assets.txt' \
            --exclude '.curated-assets.txt' \
            --exclude '_site/'

          while IFS= read -r source; do
            relative=${source#.shared-assets/final/game/assets/}
            destination="_site/assets/game/$relative"
            mkdir -p "$(dirname "$destination")"
            cp "$source" "$destination"
          done < .selected-assets.txt

      - name: Build shared asset gallery
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import html
          import json

          site = Path('_site')
          asset_root = site / 'assets' / 'game'
          image_extensions = {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.avif'}
          images = sorted(
              path.relative_to(asset_root).as_posix()
              for path in asset_root.rglob('*')
              if path.is_file() and path.suffix.lower() in image_extensions
          )

          if not images:
              raise SystemExit('No deployable images were copied into the Pages artifact.')

          (asset_root / 'manifest.json').write_text(
              json.dumps({'count': len(images), 'images': images}, indent=2),
              encoding='utf-8',
          )

          # Matches the curated list in the "Select and download gallery images" step —
          # every file there is literally named sprite.png, so a filename-derived label
          # (the old behavior) would just say "sprite" on every card. Keep these two lists
          # in sync when the curated selection changes.
          CAPTIONS = {
              'units/humans/knight/tier4/sprite.png': 'Human Knight',
              'units/humans/archer/tier4/sprite.png': 'Human Archer',
              'units/humans/rogue/tier4/sprite.png': 'Human Rogue',
              'units/humans/paladin/tier4/sprite.png': 'Human Paladin',
              'units/humans/berserker/tier4/sprite.png': 'Human Berserker',
              'units/humans/mage/tier4/sprite.png': 'Human Mage',
              'units/humans/cleric/tier4/sprite.png': 'Human Cleric',
              'units/dwarf/golem/tier4/sprite.png': 'Dwarf Golem',
              'units/elf/blademaster/tier4/sprite.png': 'Elf Blademaster',
              'units/skeleton/bone-warrior/tier4/sprite.png': 'Skeleton Bone Warrior',
              'units/orc/row-03/tier4/sprite.png': 'Orc Berserker',
              'units/merfolk/tide-guardian/tier4/sprite.png': 'Merfolk Tide Guardian',
              'units/treants/row-05/tier4/sprite.png': 'Treant Grove Warden',
              'units/vampire/crowned-vampire-king/sprite.png': 'Vampire King',
              'units/goblin/crowned-warlord/sprite.png': 'Goblin Warlord',
          }

          cards = []
          for relative_path in images:
              encoded_path = '/'.join(__import__('urllib.parse').parse.quote(part) for part in relative_path.split('/'))
              label = CAPTIONS.get(relative_path, Path(relative_path).stem.replace('-', ' ').replace('_', ' ').title())
              cards.append(
                  '<figure>'
                  '<div class="game-art-card">'
                  f'<img loading="lazy" decoding="async" src="assets/game/{encoded_path}" alt="{html.escape(label)}">'
                  '</div>'
                  f'<figcaption class="game-art-meta">{html.escape(label)}</figcaption>'
                  '</figure>'
              )

          injection = '''
          <style>
            .game-art-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:2rem}
            .game-art-card{min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,rgba(33,22,44,.92),rgba(18,13,24,.96));border:1px solid var(--line);border-radius:var(--radius);padding:.75rem}
            .game-art-card img{display:block;width:100%;height:260px;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(0,0,0,.45))}
            .game-art-meta{margin-top:.55rem;color:var(--muted);font-size:.78rem;text-align:center;overflow-wrap:anywhere}
            @media(max-width:900px){.game-art-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
            @media(max-width:560px){.game-art-grid{grid-template-columns:1fr}.game-art-card img{height:240px}}
          </style>
          <section id="game-art">
            <div class="wrap">
              <div class="section-head">
                <div><p class="eyebrow">The roster</p><h2>Real art from the game.</h2></div>
                <p>A look at the Human army and the enemy races facing it, pulled directly from the current build.</p>
              </div>
              <div class="game-art-grid">''' + ''.join(cards) + '''</div>
            </div>
          </section>
          '''

          index_path = site / 'index.html'
          page = index_path.read_text(encoding='utf-8')
          marker = '<section id="status"'
          if marker in page:
              page = page.replace(marker, injection + '\n' + marker, 1)
          elif '</main>' in page:
              page = page.replace('</main>', injection + '\n</main>', 1)
          else:
              raise SystemExit('Could not find a gallery insertion point in index.html.')

          index_path.write_text(page, encoding='utf-8')
          print(f'Prepared {len(images)} shared images for the gallery.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
