name: Deploy Portal Siege website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # Everything the site needs (index.html, privacy-policy.html, assets/) is committed
          # directly in this repo now — no cross-repo checkout or asset selection needed.
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'README.md' \
            --exclude '_site/'

          # Keep deployed image URLs aligned with the current canonical names in
          # Portal-Siege-Assets while retaining the old mirror paths for compatibility.
          sed -i \
            -e 's#assets/game/units/orc/row-03/tier4/sprite.png#assets/game/units/orc/berserker/tier4/sprite.png#g' \
            -e 's#assets/game/units/treants/row-05/tier4/sprite.png#assets/game/units/treants/deeproot-warden/tier4/sprite.png#g' \
            -e 's#Treant Grove Warden#Treant Deeproot Warden#g' \
            _site/index.html

          grep -q 'assets/game/units/orc/berserker/tier4/sprite.png' _site/index.html
          grep -q 'assets/game/units/treants/deeproot-warden/tier4/sprite.png' _site/index.html
          test -f _site/assets/game/units/orc/berserker/tier4/sprite.png
          test -f _site/assets/game/units/treants/deeproot-warden/tier4/sprite.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
