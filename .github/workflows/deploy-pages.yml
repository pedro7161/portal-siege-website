name: Deploy Portal Siege website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check out private shared assets
        uses: actions/checkout@v4
        with:
          repository: pedro7161/Portal-Siege-Assets
          ref: main
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: .shared-assets
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            .gitattributes
            final/game

      - name: Restore shared asset LFS cache
        uses: actions/cache@v4
        with:
          path: .shared-assets/.git/lfs
          key: portal-siege-assets-lfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            portal-siege-assets-lfs-${{ runner.os }}-

      - name: Select and download gallery images
        shell: bash
        run: |
          set -euo pipefail

          ASSET_ROOT=.shared-assets/final/game/assets
          if [[ ! -d "$ASSET_ROOT" ]]; then
            echo 'Expected final/game/assets in Portal-Siege-Assets.' >&2
            exit 1
          fi

          find "$ASSET_ROOT" -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.avif' \) \
            -print | sort | head -n 24 > .selected-assets.txt

          if [[ ! -s .selected-assets.txt ]]; then
            echo 'No image files found under final/game/assets.' >&2
            exit 1
          fi

          git -C .shared-assets lfs install --local

          INCLUDE_PATHS=$(sed 's#^\.shared-assets/##' .selected-assets.txt | paste -sd, -)
          git -C .shared-assets lfs pull --include="$INCLUDE_PATHS" --exclude=''

          echo "Selected $(wc -l < .selected-assets.txt) images for the website gallery."

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets/game

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.shared-assets/' \
            --exclude '.selected-assets.txt' \
            --exclude '_site/'

          while IFS= read -r source; do
            relative=${source#.shared-assets/final/game/assets/}
            destination="_site/assets/game/$relative"
            mkdir -p "$(dirname "$destination")"
            cp "$source" "$destination"
          done < .selected-assets.txt

      - name: Build shared asset gallery
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import html
          import json

          site = Path('_site')
          asset_root = site / 'assets' / 'game'
          image_extensions = {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.avif'}
          images = sorted(
              path.relative_to(asset_root).as_posix()
              for path in asset_root.rglob('*')
              if path.is_file() and path.suffix.lower() in image_extensions
          )

          if not images:
              raise SystemExit('No deployable images were copied into the Pages artifact.')

          (asset_root / 'manifest.json').write_text(
              json.dumps({'count': len(images), 'images': images}, indent=2),
              encoding='utf-8',
          )

          cards = []
          for relative_path in images:
              encoded_path = '/'.join(__import__('urllib.parse').parse.quote(part) for part in relative_path.split('/'))
              label = Path(relative_path).stem.replace('-', ' ').replace('_', ' ')
              cards.append(
                  '<figure>'
                  '<div class="game-art-card">'
                  f'<img loading="lazy" decoding="async" src="assets/game/{encoded_path}" alt="{html.escape(label)}">'
                  '</div>'
                  f'<figcaption class="game-art-meta">{html.escape(relative_path)}</figcaption>'
                  '</figure>'
              )

          injection = '''
          <style>
            .game-art-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:2rem}
            .game-art-card{min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,rgba(33,22,44,.92),rgba(18,13,24,.96));border:1px solid var(--line);border-radius:var(--radius);padding:.75rem}
            .game-art-card img{display:block;width:100%;height:260px;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(0,0,0,.45))}
            .game-art-meta{margin-top:.55rem;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
            @media(max-width:900px){.game-art-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
            @media(max-width:560px){.game-art-grid{grid-template-columns:1fr}.game-art-card img{height:240px}}
          </style>
          <section id="game-art">
            <div class="wrap">
              <div class="section-head">
                <div><p class="eyebrow">Shared asset repository</p><h2>Game art from Portal Siege.</h2></div>
                <p>These images are loaded from the finalized game assets during deployment.</p>
              </div>
              <div class="game-art-grid">''' + ''.join(cards) + '''</div>
            </div>
          </section>
          '''

          index_path = site / 'index.html'
          page = index_path.read_text(encoding='utf-8')
          marker = '<section id="status"'
          if marker in page:
              page = page.replace(marker, injection + '\n' + marker, 1)
          elif '</main>' in page:
              page = page.replace('</main>', injection + '\n</main>', 1)
          else:
              raise SystemExit('Could not find a gallery insertion point in index.html.')

          index_path.write_text(page, encoding='utf-8')
          print(f'Prepared {len(images)} shared images for the gallery.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
