name: Deploy Portal Siege website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check out private shared assets (sparse, no LFS download)
        uses: actions/checkout@v4
        with:
          repository: pedro7161/Portal-Siege-Assets
          ref: main
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: .shared-assets
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            final/web/assets/**
            assets/website/**

      - name: Restore shared asset LFS cache
        uses: actions/cache@v4
        with:
          path: .shared-assets/.git/lfs
          key: portal-siege-assets-lfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            portal-siege-assets-lfs-${{ runner.os }}-

      - name: Download only website LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git -C .shared-assets lfs install --local
          git -C .shared-assets lfs pull --include="final/web/assets/**,assets/website/**"

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets/game

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.shared-assets/' \
            --exclude '_site/'

          if [[ -d .shared-assets/final/web/assets ]]; then
            ASSET_SOURCE=.shared-assets/final/web/assets
          elif [[ -d .shared-assets/assets/website ]]; then
            ASSET_SOURCE=.shared-assets/assets/website
          else
            echo 'No website export folder found in Portal-Siege-Assets.' >&2
            echo 'Expected final/web/assets or assets/website.' >&2
            exit 1
          fi

          rsync -a --delete "${ASSET_SOURCE}/" _site/assets/game/

      - name: Build shared asset gallery
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json

          site = Path('_site')
          asset_root = site / 'assets' / 'game'
          image_extensions = {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.avif'}

          images = sorted(
              path.relative_to(asset_root).as_posix()
              for path in asset_root.rglob('*')
              if path.is_file() and path.suffix.lower() in image_extensions
          )

          manifest_path = asset_root / 'manifest.json'
          manifest_path.write_text(
              json.dumps({'count': len(images), 'images': images}, indent=2),
              encoding='utf-8',
          )

          if not images:
              raise SystemExit('No deployable images were found in the shared website export.')

          index_path = site / 'index.html'
          html = index_path.read_text(encoding='utf-8')

          injection = r'''
          <style>
            .game-art-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:2rem}
            .game-art-card{min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,rgba(33,22,44,.92),rgba(18,13,24,.96));border:1px solid var(--line);border-radius:var(--radius);padding:.75rem}
            .game-art-card img{display:block;width:100%;height:260px;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(0,0,0,.45))}
            .game-art-meta{margin-top:.55rem;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
            @media(max-width:900px){.game-art-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
            @media(max-width:560px){.game-art-grid{grid-template-columns:1fr}.game-art-card img{height:240px}}
          </style>
          <script>
            (() => {
              const createGallery = async () => {
                try {
                  const response = await fetch('assets/game/manifest.json', {cache: 'no-store'});
                  if (!response.ok) throw new Error(`Manifest request failed: ${response.status}`);
                  const manifest = await response.json();
                  const images = Array.isArray(manifest.images) ? manifest.images.slice(0, 24) : [];
                  if (!images.length) return;

                  const section = document.createElement('section');
                  section.id = 'game-art';
                  section.innerHTML = `
                    <div class="wrap">
                      <div class="section-head">
                        <div><p class="eyebrow">Shared asset repository</p><h2>Game art from Portal Siege.</h2></div>
                        <p>These images are loaded from the curated web export in <strong>Portal-Siege-Assets</strong> during deployment.</p>
                      </div>
                      <div class="game-art-grid"></div>
                    </div>`;

                  const grid = section.querySelector('.game-art-grid');
                  images.forEach((relativePath) => {
                    const figure = document.createElement('figure');
                    const card = document.createElement('div');
                    const image = document.createElement('img');
                    const caption = document.createElement('figcaption');

                    card.className = 'game-art-card';
                    image.loading = 'lazy';
                    image.decoding = 'async';
                    image.src = `assets/game/${relativePath.split('/').map(encodeURIComponent).join('/')}`;
                    image.alt = relativePath.split('/').pop().replace(/[-_]/g, ' ').replace(/\.[^.]+$/, '');
                    caption.className = 'game-art-meta';
                    caption.textContent = relativePath;

                    card.appendChild(image);
                    figure.append(card, caption);
                    grid.appendChild(figure);
                  });

                  const main = document.querySelector('main');
                  const status = document.querySelector('#status');
                  if (main) main.insertBefore(section, status || null);
                } catch (error) {
                  console.error('Unable to load shared Portal Siege assets.', error);
                }
              };

              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', createGallery, {once: true});
              } else {
                createGallery();
              }
            })();
          </script>
          '''

          if '</body>' not in html:
              raise SystemExit('index.html does not contain a closing body tag.')

          html = html.replace('</body>', injection + '\n</body>', 1)
          index_path.write_text(html, encoding='utf-8')
          print(f'Published {len(images)} shared images and added the game-art gallery.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
